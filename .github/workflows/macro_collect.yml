name: macro_collect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/macro_collect.yml', 'scripts/macro_collect.py']

permissions:
  contents: write

concurrency:
  group: relay-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: collect
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python scripts/macro_collect.py
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/selftest/macro
          git diff --staged --quiet && echo "無變更" && exit 0
          git commit -m "macro_collect $(TZ=Asia/Taipei date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done
          exit 1
