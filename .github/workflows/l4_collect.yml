name: l4_collect
# L4 政策地緣：中國商務部公告收集（2026/11/10 建）。每週一 22:00 UTC＝台北週二 06:00；Claude 每月判讀推播
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 1'
  push:
    branches: [main]
    paths: ['.github/workflows/l4_collect.yml', 'scripts/l4_collect.py']
permissions:
  contents: write
concurrency:
  group: relay-commit
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/l4_collect.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/derived/l4_cn.json
          git diff --staged --quiet && exit 0
          git commit -m "l4_collect $(TZ=Asia/Taipei date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done
          exit 1
