name: bis_watch

on:
  workflow_dispatch:
  schedule:
    # 2026/11/09 22:00 UTC＝台北 11/10 06:00，推播排程 11/10 08:43 讀結果；用完可刪本檔
    # 2026/11/10 補跑：排程到 11:00 仍未啟動，改由本次 push 觸發一次
    - cron: '0 22 9 11 *'
  push:
    branches: [main]
    paths: ['.github/workflows/bis_watch.yml', 'scripts/bis_watch.py']

permissions:
  contents: write

concurrency:
  group: relay-commit
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch
        run: python scripts/bis_watch.py
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/selftest/bis_watch.json
          git diff --staged --quiet && echo "無變更" && exit 0
          git commit -m "bis_watch $(TZ=Asia/Taipei date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done
          exit 1
