name: bis_watch

on:
  workflow_dispatch:
    inputs:
      since:
        description: '起算日 YYYY-MM-DD（留空＝2026-11-10）'
        required: false
        default: ''
  schedule:
    # 2027/01/10 22:00 UTC＝台北 01/11 06:00（暫停期 2027/01/10 屆滿）；Claude 查核排在台北 01/11 16:43（GitHub 延遲實測最長 9.6 小時）
    # 本 cron 每年 1/10 都會觸發，查核完成後須改掉或刪除本檔
    - cron: '0 22 10 1 *'
  push:
    branches: [main]
    paths: ['.github/workflows/bis_watch.yml', 'scripts/bis_watch.py']

permissions:
  contents: write

concurrency:
  group: relay-commit
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch
        env:
          BIS_SINCE: ${{ github.event.inputs.since }}
        run: python scripts/bis_watch.py
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/selftest/bis_watch.json
          git diff --staged --quiet && echo "無變更" && exit 0
          git commit -m "bis_watch $(TZ=Asia/Taipei date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done
          exit 1
