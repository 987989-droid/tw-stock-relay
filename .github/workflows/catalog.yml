name: catalog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build-endpoint-catalog
        shell: python
        run: |
          import json, os, urllib.request, datetime

          UA = "Mozilla/5.0 (compatible; tw-catalog/1.0)"

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8", errors="replace"))

          SOURCES = [
              ("TWSE", "https://openapi.twse.com.tw/v1/swagger.json"),
              ("TPEX", "https://www.tpex.org.tw/openapi/swagger.json"),
          ]

          lines = []
          lines.append("# 台股 OpenAPI 端點清單")
          lines.append("")
          lines.append("產生時間 (UTC): %s"
                       % datetime.datetime.now(datetime.timezone.utc).isoformat())
          lines.append("")

          for label, url in SOURCES:
              lines.append("")
              lines.append("## %s" % label)
              lines.append("")
              try:
                  spec = get(url)
              except Exception as e:
                  lines.append("FETCH_FAILED: %s: %s" % (type(e).__name__, e))
                  continue

              # swagger 2.0 與 openapi 3.x 的 base url 取法不同
              if "servers" in spec and spec["servers"]:
                  base = spec["servers"][0].get("url", "")
              else:
                  scheme = (spec.get("schemes") or ["https"])[0]
                  base = "%s://%s%s" % (scheme, spec.get("host", ""),
                                        spec.get("basePath", ""))
              lines.append("base: %s" % base)
              lines.append("端點數: %d" % len(spec.get("paths", {})))
              lines.append("")

              for path, ops in sorted(spec.get("paths", {}).items()):
                  op = ops.get("get") or {}
                  desc = (op.get("summary") or op.get("description") or "").strip()
                  desc = " ".join(desc.split())
                  if len(desc) > 120:
                      desc = desc[:120] + "..."
                  lines.append("- `%s`  %s" % (path, desc))

          os.makedirs("docs", exist_ok=True)
          out = "\n".join(lines) + "\n"
          with open("docs/endpoints.md", "w", encoding="utf-8") as f:
              f.write(out)
          print("已寫入 docs/endpoints.md，共 %d 行" % len(lines))

      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/endpoints.md
          git diff --staged --quiet || git commit -m "endpoint catalog"
          git push
