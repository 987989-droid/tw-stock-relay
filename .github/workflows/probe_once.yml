name: probe_once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe_once.yml', 'scripts/probe_once.py']
permissions:
  contents: write
concurrency:
  group: relay-commit
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe_once.py
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add probe
          git diff --staged --quiet && echo "無變更" && exit 0
          git commit -m "probe once $(TZ=Asia/Taipei date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done; exit 1
