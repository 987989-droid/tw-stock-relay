name: attribution

# 跌幅拆解＋市場溫度計 全市場預算（2026/11/11 建）。
# 原因：每日持股地雷監測原以 curl … | python3 - 執行 scripts/attribution.py；
#   11/09 同寫法在財報燈號週報被雲端權限分類器以「Code from External」擋下，改為此處預算，
#   排程只讀 data/derived/attribution.json（全市場約 2,000 檔，不含任何持股名單）。
# 觸發：beta／market／us_overnight 任一成功跑完即重算；本檔或腳本修改時自動跑一次。

on:
  workflow_dispatch:
  workflow_run:
    workflows: [beta, market, us_overnight]
    types: [completed]
  push:
    branches: [main]
    paths: ['.github/workflows/attribution.yml', 'scripts/attribution.py']

permissions:
  contents: write

concurrency:
  group: relay-commit       # 與 daily／news／mops 等共用，避免同時 push 互撞
  cancel-in-progress: false

jobs:
  attribution:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 等 raw.githubusercontent 快取更新（僅上游觸發時）
        if: github.event_name == 'workflow_run'
        run: sleep 360

      - name: 全市場拆解
        run: python scripts/attribution.py --all

      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/derived/attribution.json
          git diff --staged --quiet && echo "無變更" && exit 0
          git commit -m "attribution $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "push 第 $i 次失敗，等 5 秒重試"
            sleep 5
          done
          echo "push 三次都失敗"
          exit 1
