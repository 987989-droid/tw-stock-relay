name: market

on:
  workflow_dispatch:
  schedule:
    # 10:40 UTC = 台北 18:40（證交所三大法人、信用交易約 16:30 後公布；GitHub 常延遲數小時，晨間排程讀得到）
    - cron: '40 10 * * 1-5'
  push:
    branches: [main]
    paths: ['.github/workflows/market.yml', 'scripts/fetch_market.py']

permissions:
  contents: write

concurrency:
  group: relay-commit
  cancel-in-progress: false

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: python -m pip install yfinance pandas
      - name: fetch
        run: python scripts/fetch_market.py
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data/derived
          git diff --staged --quiet && echo "無變更" && exit 0
          git commit -m "market $(TZ=Asia/Taipei date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done
          exit 1
