name: probe_sec

# 一次性探測（2026/11/11）：GitHub runner 能否讀 SEC EDGAR 官方 JSON API（data.sec.gov），
#   取大客戶季度資本支出（XBRL PaymentsToAcquirePropertyPlantAndEquipment）。
# 只能手動觸發，無排程、不連鎖；結果寫 data/probe/sec.txt。失敗即停，不重試。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relay-commit
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 探測
        run: |
          mkdir -p data/probe
          python3 - > data/probe/sec.txt <<'PY'
          import json, time, urllib.request, datetime
          UA = "tw-stock-relay research-bot@example.com"
          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent": UA, "Accept-Encoding": "identity"})
              try:
                  with urllib.request.urlopen(r, timeout=30) as f:
                      return f.status, f.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:300]
              except Exception as e:
                  return "ERR", str(e).encode()
          print("probe", datetime.datetime.utcnow().isoformat(timespec="minutes"), "Z")
          s, b = get("https://www.sec.gov/files/company_tickers.json")
          print("company_tickers", s, len(b))
          cik = {"GOOGL":1652044,"MSFT":789019,"AMZN":1018724,"META":1326801,"ORCL":1341439,"NVDA":1045810,"AVGO":1730168}
          if s == 200:
              for v in json.loads(b).values():
                  cik[v["ticker"]] = v["cik_str"]
          for t in ["GOOGL", "MSFT", "AMZN", "META", "ORCL", "NVDA", "AVGO"]:
              c = cik.get(t)
              print(f"== {t} cik={c}")
              if not c: continue
              time.sleep(0.3)
              s, b = get(f"https://data.sec.gov/submissions/CIK{c:010d}.json")
              if s == 200:
                  j = json.loads(b); r = j["filings"]["recent"]
                  last = [(r["form"][i], r["filingDate"][i]) for i in range(len(r["form"])) if r["form"][i] in ("10-Q","10-K")][:2]
                  print("  submissions 200", j.get("name"), "latest 10-Q/K:", last)
              else:
                  print("  submissions", s, b[:120])
              for concept in ["PaymentsToAcquirePropertyPlantAndEquipment", "PaymentsToAcquireProductiveAssets"]:
                  time.sleep(0.3)
                  s, b = get(f"https://data.sec.gov/api/xbrl/companyconcept/CIK{c:010d}/us-gaap/{concept}.json")
                  if s != 200:
                      print(f"  {concept}: {s}"); continue
                  rows = [x for x in json.loads(b)["units"]["USD"] if x.get("form") in ("10-Q","10-K") and "frame" in x]
                  rows.sort(key=lambda x: x["end"])
                  print(f"  {concept}: rows={len(rows)} latest:")
                  for x in rows[-4:]:
                      print("   ", x["start"], "~", x["end"], x["val"], x["form"], "filed", x["filed"], "frame", x["frame"])
                  break
          PY
          cat data/probe/sec.txt
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/probe
          git diff --staged --quiet && exit 0
          git commit -m "probe sec"
          git pull --rebase origin main && git push origin main
