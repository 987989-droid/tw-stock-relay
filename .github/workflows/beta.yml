name: beta

on:
  workflow_dispatch:
  schedule:
    - cron: '50 20 10 * *'
    - cron: '50 20 15 4,5,8,11 *'
    # 週一至五 10:50 UTC = 台北 18:50（2026/11/06 由週六改為每交易日：供地雷監測跌幅拆解與週日注意力落差使用；全市場約 3–7 分鐘）
    - cron: '50 10 * * 1-5'
  push:
    branches: [main]
    paths: ['.github/workflows/beta.yml', 'scripts/fetch_beta.py']

permissions:
  contents: write

concurrency:
  group: relay-commit
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: python -m pip install yfinance pandas
      - name: fetch
        run: python scripts/fetch_beta.py
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/derived
          git diff --staged --quiet && echo "無變更" && exit 0
          git commit -m "beta $(TZ=Asia/Taipei date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done
          exit 1
