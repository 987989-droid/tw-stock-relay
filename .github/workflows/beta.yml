name: beta

on:
  workflow_dispatch:
  schedule:
    - cron: '20 18 10 * *'
    - cron: '20 18 15 4,5,8,11 *'
  push:
    branches: [main]
    paths: ['.github/workflows/beta.yml', 'scripts/fetch_beta.py']

permissions:
  contents: write

concurrency:
  group: relay-commit
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: python -m pip install yfinance pandas
      - name: fetch
        run: python scripts/fetch_beta.py
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/derived
          git diff --staged --quiet && echo "無變更" && exit 0
          git commit -m "beta $(TZ=Asia/Taipei date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done
          exit 1
