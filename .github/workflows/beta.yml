name: beta

on:
  workflow_dispatch:
  schedule:
    - cron: '50 20 10 * *'
    - cron: '50 20 15 4,5,8,11 *'
    # 週六 08:50 UTC = 台北週六 16:50（取週五收盤），供週日 10:37「注意力落差」推播使用；GitHub 延遲數小時仍來得及（2026/11/04 新增）
    - cron: '50 8 * * 6'
  push:
    branches: [main]
    paths: ['.github/workflows/beta.yml', 'scripts/fetch_beta.py']

permissions:
  contents: write

concurrency:
  group: relay-commit
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: python -m pip install yfinance pandas
      - name: fetch
        run: python scripts/fetch_beta.py
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/derived
          git diff --staged --quiet && echo "無變更" && exit 0
          git commit -m "beta $(TZ=Asia/Taipei date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done
          exit 1
