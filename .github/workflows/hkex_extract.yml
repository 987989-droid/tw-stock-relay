name: hkex_extract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/hkex_extract.yml', 'scripts/extract_hkex.py']

permissions:
  contents: write

concurrency:
  group: relay-commit
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: probe
        run: python scripts/extract_hkex.py
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/selftest
          git diff --staged --quiet && echo "無變更" && exit 0
          git commit -m "hkex_extract $(TZ=Asia/Taipei date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done
          exit 1
