name: revhist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 10 * *'
  push:
    branches: [main]
    paths: ['.github/workflows/revhist.yml', 'scripts/fetch_revhist.py']

permissions:
  contents: write

concurrency:
  group: relay-commit
  cancel-in-progress: false

jobs:
  revhist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch
        run: python scripts/fetch_revhist.py
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/derived
          git diff --staged --quiet && echo "無變更" && exit 0
          git commit -m "revhist $(TZ=Asia/Taipei date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done
          exit 1
