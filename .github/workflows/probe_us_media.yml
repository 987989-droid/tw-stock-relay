name: probe_us_media
# 2026/11/17 三大美媒可抓性探測（手動觸發，結果 data/probe/us_media.json）
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: relay-commit
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_us_media.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/probe/us_media.json; git diff --staged --quiet && exit 0
          git commit -m "probe us_media"; for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done; exit 1
