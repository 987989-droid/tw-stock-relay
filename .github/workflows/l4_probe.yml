name: l4_probe
# 一次性探測（2026/11/10）：L4 各國政策一手來源可抓性。用完可刪本檔與 scripts/l4_probe.py
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/l4_probe.yml', 'scripts/l4_probe.py']
permissions:
  contents: write
concurrency:
  group: relay-commit
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/l4_probe.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/selftest/l4_probe.json
          git diff --staged --quiet && exit 0
          git commit -m "l4_probe $(TZ=Asia/Taipei date +%F_%H%M)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0; sleep 5; done
          exit 1
