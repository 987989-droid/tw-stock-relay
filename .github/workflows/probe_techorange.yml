name: probe_techorange

# 一次性探測（2026/11/11）：GitHub runner 能否抓科技報橘（TechOrange）首頁／最新文章頁／RSS。
# 只能手動觸發，無排程、不連鎖；結果寫 data/probe/techorange.txt。失敗即停，不重試。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relay-commit
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 探測
        run: |
          mkdir -p data/probe
          out=data/probe/techorange.txt
          echo "probe $(date -u +%Y-%m-%dT%H:%MZ)" > $out
          for u in \
            https://buzzorange.com/techorange/ \
            https://buzzorange.com/techorange/latest/ \
            https://buzzorange.com/techorange/feed/ \
            https://techorange.com/ \
            https://techorange.com/feed/ ; do
            f=$(mktemp)
            r=$(curl -sS -L -m 30 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36" \
                 -o "$f" -w '%{http_code} %{content_type} %{size_download} final=%{url_effective}' "$u" 2>&1 || true)
            echo "== $u -> $r" >> $out
            python3 - "$f" >> $out <<'PY'
          import sys, re, html
          t = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          if "<rss" in t[:2000] or "<feed" in t[:2000]:
              items = re.findall(r"<item>(.*?)</item>", t, re.S)
              print(f"  RSS items={len(items)} lastBuildDate={(re.findall(r'<lastBuildDate>(.*?)<', t) or ['-'])[0]}")
              for it in items[:8]:
                  ti = re.findall(r"<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?</title>", it, re.S)
                  pd = re.findall(r"<pubDate>(.*?)</pubDate>", it)
                  ln = re.findall(r"<link>(.*?)</link>", it)
                  print("  -", (pd or ['-'])[0], "|", html.unescape((ti or ['-'])[0]).strip()[:80], "|", (ln or ['-'])[0])
          else:
              ti = re.findall(r"<title>(.*?)</title>", t, re.S)
              print("  html title:", html.unescape(ti[0]).strip()[:80] if ti else "-")
              dates = re.findall(r"20\d\d[-/.]\d{1,2}[-/.]\d{1,2}", t)
              print("  dates found:", sorted(set(dates))[-5:])
              links = sorted(set(re.findall(r'href="(https://buzzorange\.com/techorange/20\d\d/\d\d/\d\d/[^"]+)"', t)))
              print(f"  article links={len(links)}")
              for l in links[-8:]: print("   ", l)
              if len(t) < 600: print("  body:", t.replace("\n"," ")[:500])
          PY
          done
          cat $out
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/probe
          git diff --staged --quiet && exit 0
          git commit -m "probe techorange"
          git pull --rebase origin main && git push origin main
