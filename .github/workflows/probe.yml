name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe-tw-endpoints
        shell: python
        run: |
          import json, urllib.request, urllib.error, datetime

          TIMEOUT = 20
          UA = "Mozilla/5.0 (compatible; tw-probe/1.0)"

          CANDIDATES = [
              ("TWSE_SWAGGER",
               "https://openapi.twse.com.tw/v1/swagger.json"),
              ("TWSE_STOCK_DAY_ALL",
               "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL"),
              ("TWSE_BWIBBU_ALL",
               "https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL"),
              ("TWSE_T187AP05_L",
               "https://openapi.twse.com.tw/v1/opendata/t187ap05_L"),
              ("TWSE_T187AP06_L",
               "https://openapi.twse.com.tw/v1/opendata/t187ap06_L"),
              ("TPEX_SWAGGER",
               "https://www.tpex.org.tw/openapi/swagger.json"),
              ("TPEX_DAILY_CLOSE",
               "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes"),
              ("MOPS_INDEX",
               "https://mops.twse.com.tw/mops/web/index"),
              ("DATA_GOV_11549",
               "https://data.gov.tw/api/v2/rest/dataset/11549"),
              ("CONTROL_GITHUB",
               "https://raw.githubusercontent.com/github/gitignore/main/Python.gitignore"),
          ]

          rows = []
          for name, url in CANDIDATES:
              row = {"name": name, "status": None, "bytes": None,
                     "json": False, "count": None, "keys": None, "err": None}
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": UA})
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                      raw = r.read()
                      row["status"] = r.status
                      row["bytes"] = len(raw)
                      txt = raw.decode("utf-8", errors="replace")
                      try:
                          d = json.loads(txt)
                          row["json"] = True
                          if isinstance(d, list):
                              row["count"] = len(d)
                              if d and isinstance(d[0], dict):
                                  row["keys"] = list(d[0].keys())
                          elif isinstance(d, dict):
                              row["keys"] = list(d.keys())[:20]
                      except json.JSONDecodeError:
                          row["err"] = "not-json"
              except urllib.error.HTTPError as e:
                  row["status"] = e.code
                  row["err"] = "HTTP %s %s" % (e.code, e.reason)
              except Exception as e:
                  row["err"] = "%s: %s" % (type(e).__name__, e)
              rows.append(row)
              print("done %s -> %s" % (name, row["status"]), flush=True)

          print("")
          print("===== COPY FROM HERE =====")
          print("probed_at_utc: %s"
                % datetime.datetime.now(datetime.timezone.utc).isoformat())
          for r in rows:
              ok = "OK" if (r["status"] == 200 and r["json"]) else "NG"
              print("")
              print("%s [%s] status=%s bytes=%s count=%s err=%s"
                    % (r["name"], ok, r["status"], r["bytes"],
                       r["count"], r["err"]))
              if r["keys"]:
                  print("  keys: %s" % r["keys"])
          print("")
          print("===== COPY TO HERE =====")
